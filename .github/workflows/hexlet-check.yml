##########################################################################
#                    DO NOT DELETE OR EDIT THIS FILE                     #
#     This file is automatically generated and used to run tests         #
##########################################################################

name: hexlet-check

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Hexlet project check
        uses: hexlet/project-action@release
        with:
          hexlet-id: ${{ secrets.HEXLET_ID }}

      - name: Copy student code to test source
        if: failure()
        run: |
          echo "=== Checking mount paths ==="
          ls -la /var/tmp/source/code/ 2>/dev/null || echo "No /var/tmp/source/code"
          echo "=== Checking checkout ==="
          ls -la $GITHUB_WORKSPACE/code/ 2>/dev/null || echo "No code in checkout"
          echo "=== Docker compose config ==="
          cat /var/tmp/source/docker-compose.yml 2>/dev/null || echo "No compose in source"
          echo "=== Env ==="
          env | grep -i path | head -5
          echo "=== PWD ==="
          pwd
